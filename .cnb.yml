main:
  push:
    - name: 朋友圈 Lite 更新服务
      runner:
        cpus: 4
      # 引入你的环境变量/密钥文件 (如果用 CNB 界面配置了环境变量，这段可省略)
      imports:
        - https://cnb.cool/ke2h/secret/-/blob/main/envs.yml
      docker:
        # 🌟 优化1：直接使用 Python 3.12 原生镜像
        image: python:3.12
        volumes:
          # 🌟 优化2：利用云原生缓存，pip 和 temp 目录跨任务自动继承，省去繁琐的 Artifacts 上传/下载
          - /root/.cache/pip:copy-on-write
          - ./temp:copy-on-write
      env:
        TZ: Asia/Shanghai
        PAGE_BRANCH: page
      stages:
        - name: 安装依赖
          script: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            
        - name: 初始化 Temp 目录
          script: |
            mkdir -p ./temp
            echo "placeholder" > ./temp/.keep
            
        - name: 检查 RSS 更新并生成内容
          env:
            # 你的环境变量，如果是从 imports 获取的，这里会自动读取
            SMTP_PWD: $SMTP_PWD
            PROXY_URL: $PROXY_URL
            FCL_REPO: $CNB_REPO_SLUG
          script: |
            echo "Checking RSS feeds..."
            python run.py
            ls ./temp
            
        - name: 构建并发布到 Page 分支
          script: |
            # 1. 组装静态资源
            mkdir pages
            cp -r main ./static/edgeone.json ./static/_headers ./static/index.html ./static/readme.md ./static/favicon.ico ./static/bg-light.webp ./static/bg-dark.webp all.json link.json errors.json pages/ 2>/dev/null || true
            
            # 2. 远端树哈希对比优化 (避免无改动时的无效提交)
            REPO_URL="https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git"
            published_tree=""
            
            # 🌟 优化3：直接拉取远端目标分支，无需纠结本地 origin 配置
            if git fetch $REPO_URL "${PAGE_BRANCH}"; then
              published_tree=$(git rev-parse FETCH_HEAD^{tree})
            fi
            
            # 3. 初始化并提交
            cd pages
            git init
            git config user.name 'cnb-bot'
            git config user.email 'cnb-bot@cnb.cool'
            git add .
            
            generated_tree=$(git write-tree)
            if [ -n "$published_tree" ] && [ "$generated_tree" = "$published_tree" ]; then
              echo "没有发现静态资源的变动，跳过推送。"
              exit 0
            fi
            
            git commit -m "⏱️ $(date +"%Y年%m月%d日-%H时%M分") CNB自动定时更新"
            # 🌟 优化4：使用原生 Token 强制覆盖推送
            git push --force $REPO_URL HEAD:${PAGE_BRANCH}